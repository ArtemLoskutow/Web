<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Поставка товаров в колонию на Луне</title>
</head>
<body>
    <header>
        <h1>Dominium Scientia Industris</h1>
        <section id="header">
            <p>Товаров в корзине: <span id="cart-count">0</span></p>

            <button id="open-cart" type="button" class="FormButton">Открыть корзину</button>
            <dialog id="cart">
                <form id="cart-form">
                    <p><label>Ваше имя: <input type="text" placeholder="Имя" required></label></p>
                    <p><label>Ваша фамилия: <input type="text" placeholder="Фамилия" required></label></p>
                    <p><label>Выберите адрес: <select id="address-list" required></select></label></p>
                    <p><label>Контактный телефон: <input type="number" placeholder="Без + и -" required></label></p>
                    <p id="form-text">Товаров на сумму <span id="cart-price">0</span> сплава белокамня.</p>
                    <button type="submit" class="FormButton">Создать заказ</button>
                </form>
                <p><button id="close-cart" class="FormButton" type="button">Вернуться в каталог</button></p>
            </dialog>
        </section>
    </header>
    
    <main>
        <section class="Сatalogue">
            <h2>Снабжение лунной колонии</h2>
            <div class="CatalogueGrid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
