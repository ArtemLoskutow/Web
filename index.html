<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Консоль лунной колонии</title>
</head>
<body>
    <header>
        <h1>Dominium Scientia Industris</h1>
        <p>Товаров в корзине: <span id="cart-count">0</span></p>

        <button id="open-cart" type="button">Открыть корзину</button>
        <dialog id="cart">
            <form>
                <p><label>Ваше имя: <input type="text" placeholder="Имя" required></label></p>
                <p><label>Ваша фамилия: <input type="text" placeholder="Фамилия" required></label></p>
                <p><label>Выберите адрес: <select id="address-list" required></select></label></p>
                <p><label>Контактный телефон: <input type="text" placeholder="Без + и -" required></label></p>
                <p>Товаров на сумму <span id="cart-price">0</span> сплава белокамня.</p>
                <button type="submit">Оформить покупку</button>
            </form>
            <p><button id="close-cart" type="button">Вернуться в каталог</button></p>
        </dialog>
    </header>
    
    <main>
        <section class="Сatalogue">
            <h2>Снабжение лунной колонии</h2>
            <div class="CatalogueGrid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
