<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Консоль лунной колонии</title>
</head>
<body>
    <header>
        <h1> Dominium Scientia Industris </h1>
        <p>Товаров в корзине: <span id="cart-count">0</span></p>
    </header>
    
    <main>
        <section class="catalogue">
            <h2 id="catalogue-title">Снабжение лунной колонии</h2>

            <article class="item">
                <h2>Набор деталей</h2>
                <p>1 сплав белокамня</p>
                <button type="button" id="item-1" class="buy-button">Добавить в корзину</button>
            </article>

            <article class="item">
                <h2>Набор инструментов</h2>
                <p>5 сплавов белокамня</p>
                <button type="button" id="item-2" class="buy-button">Добавить в корзину</button>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
